# Liki layer notifications; Studio is not required. The right half is unchanged.
CONFIG_ZMK_LIKI=y

# Let the right half skip at most 4 split connection events (default 30, about
# 230 ms at 7.5 ms) so underglow changes sent from the left reach it within
# about 40 ms. Costs some right-hand battery life while idle.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=4
