# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: bifrost_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: bifrost_left_studio
  - board: bifrost_right
  - board: bifrost_left
    shield: settings_reset
    artifact-name: bifrost_left_settings_reset
  - board: bifrost_right
    shield: settings_reset
    artifact-name: bifrost_right_settings_reset
  - board: bifrost_left
    snippet: studio-rpc-usb-uart;zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_SPI_LOG_LEVEL_DBG=y -DCONFIG_LED_STRIP_LOG_LEVEL_DBG=y
    artifact-name: bifrost_left_rgb_debug
  - board: bifrost_left
    snippet: studio-rpc-usb-uart;zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_WS2812_STRIP_SPI=n -DCONFIG_WS2812_STRIP_GPIO=y -DCONFIG_SPI=n -DCONFIG_LED_STRIP_LOG_LEVEL_DBG=y -DEXTRA_DTC_OVERLAY_FILE=/tmp/zmk-config/config/bifrost-rgb-gpio.overlay
    artifact-name: bifrost_left_rgb_gpio_debug
  - board: bifrost_left
    snippet: studio-rpc-usb-uart;zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_WS2812_STRIP_SPI=n -DCONFIG_WS2812_STRIP_GPIO=y -DCONFIG_SPI=n -DCONFIG_SHELL=y -DCONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y -DCONFIG_BIFROST_RGB_DIAGNOSTICS=y -DCONFIG_LOG_BACKEND_UART=n -DEXTRA_DTC_OVERLAY_FILE=/tmp/zmk-config/config/bifrost-rgb-gpio.overlay
    artifact-name: bifrost_left_rgb_meter_debug
  - board: bifrost_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_WS2812_STRIP_SPI=n -DCONFIG_WS2812_STRIP_GPIO=y -DCONFIG_SPI=n -DCONFIG_BIFROST_RGB_AUTO_TEST=y -DEXTRA_DTC_OVERLAY_FILE=/tmp/zmk-config/config/bifrost-rgb-gpio.overlay
    artifact-name: bifrost_left_rgb_autotest
